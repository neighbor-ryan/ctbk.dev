name: Animation history audit
on:
  workflow_dispatch:
    inputs:
      months:
        description: Inclusive animation months (YYYYMM-YYYYMM)
        default: '201306-202609'
        required: true
      stage_month:
        description: Optional YYYYMM to rebuild and verify the formal DVX stage on this runner
        required: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Audit published counts and decode boundary-day samples
        env:
          MONTHS: ${{ inputs.months }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: .venv/bin/ctbk rides-anim check-index -d "$MONTHS"
      - uses: actions/upload-artifact@v4
        with:
          name: animation-history-audit
          path: tmp/animation-index-audit.json
      - name: Verify formal DVX month stage
        if: inputs.stage_month != ''
        env:
          STAGE_MONTH: ${{ inputs.stage_month }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DVC_SITE_CACHE_DIR: ${{ runner.temp }}/dvc-site-cache
        run: |
          .venv/bin/ctbk ride-animation create -w1 "$STAGE_MONTH"
          .venv/bin/ctbk rides-anim check -i "s3/ctbk/rides-animation/$STAGE_MONTH"
      - name: Preserve DVX stage metadata
        if: inputs.stage_month != ''
        uses: actions/upload-artifact@v4
        with:
          name: animation-dvx-stage
          path: |
            s3/ctbk/rides-animation/*.dvc
            s3/ctbk/rides-animation/*/month.json
